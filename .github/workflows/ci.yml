name: CI

# 每次推送与 PR 都跑仓库自带的冒烟测试（此前测试只在本地手动跑，
# 仓库坏没坏全靠人记得验证）。只读检查，不部署、不写 KV。
on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: 冒烟测试
        run: node scripts/smoke.mjs
      - name: 定向测试
        run: |
          node tests/probe-dns.mjs
          node tests/store-events-session.mjs
          node tests/c-fixes.mjs
